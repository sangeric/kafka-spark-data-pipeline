# Pipeline Binance : Spark 4 (1 master + 2 workers) + Airflow 3 + Postgres
#
# Aucune valeur sensible ici : tout vient du fichier .env (jamais commité).
# Modèle à copier : .env.example
#
# Lancement :
#   docker compose up airflow-init   # initialise la base Airflow (une seule fois)
#   docker compose up -d             # démarre tout
#
# Ports publiés sur 127.0.0.1 uniquement : accessibles depuis ton PC,
# pas depuis le reste du réseau (Wi-Fi, box...).

# ---------------------------------------------------------------------------
# Blocs communs (ancres YAML) : évitent de répéter la même config 4 fois
# ---------------------------------------------------------------------------

#launch a spark job : docker exec -it spark-master /opt/spark/bin/spark-submit --master spark://spark-master:7077 /opt/spark/project/src/orchestrator.py batch

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # Utilisateur de l'UI : "nom:rôle". Le mot de passe est lu dans le fichier ci-dessous
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/secrets/simple_auth_manager_passwords.json
  PYTHONPATH: /opt/airflow

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION}
  # Pour que les DAGs binance puissent lancer Spark (PySpark + Java + CLI docker),
  # remplacer la ligne "image" ci-dessus par :
  # build:
  #   context: .
  #   dockerfile: Dockerfile.airflow
  #   args:
  #     AIRFLOW_VERSION: ${AIRFLOW_VERSION}
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./secrets:/opt/airflow/secrets

x-spark-volumes: &spark-volumes
  - ./:/opt/spark/project
  # Même chemin que côté Airflow : quand le driver tourne dans Airflow (DAG API),
  # les exécuteurs trouvent les fichiers au chemin /opt/airflow/data qu'il leur donne
  - ./data:/opt/airflow/data

x-spark-worker: &spark-worker
  image: apache/spark:${SPARK_VERSION}
  depends_on:
    - spark-master
  command:
    - /opt/spark/sbin/start-worker.sh
    - spark://spark-master:7077
  environment:
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
    SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    SPARK_NO_DAEMONIZE: "true"
  volumes: *spark-volumes
  working_dir: /opt/spark/project

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:

  spark-master:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/sbin/start-master.sh
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # Le driver du job batch tourne ici : sans ça, "from src.download ..." échoue
      # (Python n'ajoute que le dossier du script, src/, à son chemin d'import)
      PYTHONPATH: /opt/spark/project
    ports:
      - "127.0.0.1:${SPARK_UI_PORT}:8080"   # UI Spark ; le port 7077 reste interne au réseau Docker
    volumes: *spark-volumes
    working_dir: /opt/spark/project

  spark-worker-1:
    <<: *spark-worker
    container_name: spark-worker-1
    hostname: spark-worker-1

  spark-worker-2:
    <<: *spark-worker
    container_name: spark-worker-2
    hostname: spark-worker-2

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command:
      - bash
      - -c
      - airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./secrets:/opt/airflow/secrets
      - /var/run/docker.sock:/var/run/docker.sock   # permet "docker exec spark-master ..." (DAG batch)
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_started

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
